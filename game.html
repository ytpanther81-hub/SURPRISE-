<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Birthday Surprises! 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body.game-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4ebd0 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(176, 141, 87, 0.2);
            border: 1px solid #f3e5ab;
            text-align: center;
            max-width: 380px;
            width: 90%;
            height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-sizing: border-box;
        }

        .game-header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 38px;
            color: #b08d57;
            margin: 0 0 5px 0;
        }

        .game-header p {
            font-size: 13px;
            color: #666;
            margin: 0;
        }

        /* Scoreboard */
        .scoreboard {
            font-size: 15px;
            font-weight: 500;
            color: #aa771c;
            background: #fdf8ec;
            padding: 6px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px auto;
            border: 1px solid #f3e5ab;
        }

        /* The Play Area where items spawn */
        .play-area {
            position: relative;
            width: 100%;
            height: 280px;
            background: #fffcf5;
            border-radius: 16px;
            border: 2px dashed #e6d2a5;
            overflow: hidden;
            cursor: pointer;
        }

        /* Falling / Spawning Target Items */
        .target-item {
            position: absolute;
            font-size: 36px;
            cursor: pointer;
            transition: transform 0.1s ease;
            animation: popIn 0.3s ease-out;
        }

        .target-item:active {
            transform: scale(1.3);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Win or Lose Screen Overlay */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
        }

        .overlay-screen h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #b08d57;
            margin: 0 0 10px 0;
        }

        .code-display {
            font-size: 26px;
            font-weight: bold;
            color: #aa771c;
            background: #fdf8ec;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px dashed #b08d57;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .unlock-btn {
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: center;
            line-height: 45px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: white;
            font-weight: 500;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(170, 119, 28, 0.3);
            border: none;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body class="game-page">

    <div class="game-card">
        <div class="game-header">
            <h1>Catch 10 Surprises! 💖</h1>
            <p>Tap surprises, but <b>avoid the bombs (💣)</b>!</p>
            <div class="scoreboard">Score: <span id="score">0</span> / 10</div>
        </div>

        <!-- Interactive Play Field -->
        <div class="play-area" id="playArea"></div>

        <button class="unlock-btn" id="startBtn" onclick="startGame()">Start Game 🎮</button>

        <!-- Win Overlay -->
        <div class="overlay-screen" id="winScreen">
            <h2>You Won! 🎉</h2>
            <p style="font-size: 13px; color: #555; margin: 0;">Your secret unlock code is:</p>
            <div class="code-display">SUP4U</div>
            <button class="unlock-btn" onclick="goToMain()">Go Unlock Surprise 🔓</button>
        </div>

        <!-- Lose Overlay -->
        <div class="overlay-screen" id="loseScreen">
            <h2 style="color: #d9534f;">You Lose! 💥</h2>
            <p style="font-size: 13px; color: #555; margin: 0 0 15px 0;">Oh no! You hit a bomb!</p>
            <button class="unlock-btn" onclick="startGame()">Try Again 🔄</button>
        </div>
    </div>

    <script>
        let score = 0;
        const targetScore = 10;
        let gameInterval;
        const itemsList = ['💖', '🎂', '🌸', '🎁', '✨', '🧁', '💣', '💣']; // Added bombs to the mix

        function startGame() {
            score = 0;
            document.getElementById("score").textContent = score;
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("winScreen").style.display = "none";
            document.getElementById("loseScreen").style.display = "none";
            document.getElementById("playArea").innerHTML = "";

            // Spawn items every 650 milliseconds
            gameInterval = setInterval(spawnItem, 650);
        }

        function spawnItem() {
            const playArea = document.getElementById("playArea");
            
            if (score >= targetScore) return;

            const item = document.createElement("div");
            item.classList.add("target-item");
            const randomContent = itemsList[Math.floor(Math.random() * itemsList.length)];
            item.innerHTML = randomContent;

            // Random position inside play area
            const maxX = playArea.clientWidth - 50;
            const maxY = playArea.clientHeight - 50;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            item.style.left = randomX + "px";
            item.style.top = randomY + "px";

            // Click action
            item.onclick = function() {
                if (randomContent === '💣') {
                    // Hit a bomb! Game Over
                    clearInterval(gameInterval);
                    playArea.innerHTML = "";
                    document.getElementById("loseScreen").style.display = "flex";
                } else {
                    // Normal item clicked
                    score++;
                    document.getElementById("score").textContent = score;
                    item.remove();

                    if (score >= targetScore) {
                        clearInterval(gameInterval);
                        playArea.innerHTML = "";
                        document.getElementById("winScreen").style.display = "flex";
                    }
                }
            };

            playArea.appendChild(item);

            // Item disappears after 1.1 seconds
            setTimeout(() => {
                if (item.parentElement) {
                    item.remove();
                }
            }, 1100);
        }

        function goToMain() {
            window.location.href = "index.html?code=SUP4U";
        }
    </script>

</body>
</html>
